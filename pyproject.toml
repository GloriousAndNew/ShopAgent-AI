[project]
name = "shopagent-ai-mvp"
version = "2.0.0"
description = "按原文角色编排、独立工具模块热插拔的 ShopAgent MVP"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "mcp==1.30.0", "python-a2a==0.5.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
